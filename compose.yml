services:
  traefik:
    restart: unless-stopped
    image: traefik:${TRAEFIK_VERSION:?set TRAEFIK_VERSION in .env}
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedByDefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.metrics.address=:8082"
      - "--tracing.otlp=true"
      - "--tracing.otlp.http=true"
      - "--tracing.otlp.http.endpoint=http://jaeger:4318/v1/traces"
      - "--tracing.serviceName=traefik"
      - "--tracing.addInternals=true"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entryPoint=metrics"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.2,5.0"
      - "--accesslog=true"
      - "--accesslog.filepath=/var/log/traefik/access.log"
      - "--accesslog.format=json"
      - "--serversTransport.forwardingTimeouts.dialTimeout=2s"
      - "--serversTransport.forwardingTimeouts.idleConnTimeout=90s"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=180s"
    ports:
      - "80:80"
    expose:
      - "8082"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/var/log/traefik:/var/log/traefik"
    networks:
      - app-network

  symfony:
    env_file:
      - path: ./.env
        required: true
    environment:
      PHP_IDE_CONFIG: serverName=${MAIN_HOST}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=${IMAGE_POSTGRES_VERSION}&charset=utf8"
      SERVER_NAME: ":80"
      MAX_REQUESTS: "500"
      GOMEMLIMIT: "512MiB"
    expose:
      - "80"
      - "443"
      - "443/udp"
    volumes:
      - ./api-symfony/public/storage:/app/public/storage:rw
      - ./api-symfony/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./api-symfony/.env:/app/.env:ro
    command: sh -c "php bin/console cache:warmup --no-interaction && frankenphp run --config /etc/caddy/Caddyfile"
    # Traefik routing for Symfony is defined per-environment in the override files
    # (compose.override.dev.yaml / compose.override.prod.yaml) so routes never clash.
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - postgres
      - victoria-logs
    healthcheck:
      test: [ "CMD-SHELL", "php -r 'exit(file_get_contents(\"http://127.0.0.1/health\") === \"OK\" ? 0 : 1);'" ]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api-go:
    build:
      context: ./api-go
      dockerfile: ./Dockerfile
      args:
        GO_VERSION: ${IMAGE_GO_VERSION:?set IMAGE_GO_VERSION in .env}
    env_file:
      - path: ./.env
        required: true
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      API_KEY: "${GO_API_KEY}"
      APP_ENV: "${APP_ENV}"
    expose:
      - "8081"
    volumes:
      - ./api-symfony/public/seo:/seo:ro
      - ./api-symfony/public/storage:/storage:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8081/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  pets-app:
    restart: unless-stopped
    build:
      context: ./.docker/php-simple
      dockerfile: ./Dockerfile
      args:
        PHP_VERSION: ${PHP_VERSION}
    env_file:
      - path: ./.env
        required: true
    networks:
      - app-network

  postgres:
    restart: unless-stopped
    image: postgres:${IMAGE_POSTGRES_VERSION:?set IMAGE_POSTGRES_VERSION in .env}-alpine
    env_file:
      - path: ./.env
        required: true
      - path: ./.env.local
        required: false
    volumes:
      - postgres18_data:/var/lib/postgresql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  victoria-logs:
    image: victoriametrics/victoria-logs:${VICTORIA_LOGS_VERSION:?set VICTORIA_LOGS_VERSION in .env}
    expose:
      - "9428"
    volumes:
      - victoria_logs_data:/victoria-logs-data
    command:
      - -storageDataPath=/victoria-logs-data
      - -retentionPeriod=30d
    networks:
      - app-network
    restart: unless-stopped

  vector:
    image: timberio/vector:${VECTOR_VERSION:?set VECTOR_VERSION in .env}-alpine
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./.devops/vmetrics/vector.toml:/etc/vector/vector.toml:ro
    environment:
      VICTORIA_LOGS_HOST: victoria-logs
      VICTORIA_LOGS_PORT: "9428"
    command: -c /etc/vector/vector.toml
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - victoria-logs
    labels:
      - "traefik.enable=false"

  vmauth:
    image: victoriametrics/vmauth:${VMAUTH_VERSION:?set VMAUTH_VERSION in .env}
    expose:
      - "8427"
    volumes:
      - ./.devops/vmetrics/vmauth-entrypoint.sh:/entrypoint.sh:ro
    environment:
      VMAUTH_ADMIN_USER: ${VMAUTH_ADMIN_USER}
      VMAUTH_ADMIN_PASS: ${VMAUTH_ADMIN_PASS}
      VMAUTH_READONLY_USER: ${VMAUTH_READONLY_USER}
      VMAUTH_READONLY_PASS: ${VMAUTH_READONLY_PASS}
    entrypoint: sh /entrypoint.sh
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - victoria-logs

  jaeger:
    image: jaegertracing/jaeger:${JAEGER_VERSION:?set JAEGER_VERSION in .env}
    command:
      - "--set=receivers.otlp.protocols.grpc.endpoint=0.0.0.0:4317"
      - "--set=receivers.otlp.protocols.http.endpoint=0.0.0.0:4318"
    expose:
      - "4317"   # OTLP gRPC receiver
      - "4318"   # OTLP HTTP receiver
      - "16686"  # Query UI (web interface)
    networks:
      - app-network
    restart: unless-stopped

  astro-frontend:
    restart: unless-stopped
    environment:
      API_KEY: "${GO_API_KEY}"
      PORT: "4321"
      HOST: "0.0.0.0"
    expose:
      - "4321"
    networks:
      - app-network
    depends_on:
      api-go:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  postgres18_data:
  victoria_logs_data:
  astro_node_modules:
  geoip_data:
