services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:?set PROMETHEUS_VERSION in .env}
    container_name: prometheus
    expose:
      - "9090"
    volumes:
      - ./.devops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - app-network
    restart: unless-stopped
    labels:
      - "traefik.enable=true"

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:?set GRAFANA_VERSION in .env}
    container_name: grafana
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./.devops/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./.devops/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      - prometheus
    labels:
      - "traefik.enable=true"

  grafana-dashboard-loader:
    image: curlimages/curl:latest
    container_name: grafana-dashboard-loader
    depends_on:
      - grafana
    volumes:
      - ./.devops/monitoring/grafana/dashboards:/dashboards:ro
      - ./.devops/monitoring/grafana/provisioning-init.sh:/provisioning-init.sh:ro
    networks:
      - app-network
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    command: sh -c "sleep 5 && sh /provisioning-init.sh"
    restart: on-failure
    labels:
      - "traefik.enable=false"

  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION:?set CADVISOR_VERSION in .env}
    container_name: cadvisor
    expose:
      - "8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/kmsg:/dev/kmsg:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - app-network
    restart: unless-stopped
    labels:
      - "traefik.enable=false"
