global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "my-blog"
    environment: "dev"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:8082"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "traefik"

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
