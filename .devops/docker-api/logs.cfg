global
  log stdout format raw local0

defaults
  mode http
  log global
  option httplog
  timeout connect 3s
  timeout client 1h
  timeout server 1h

frontend logs
  bind :2376
  acl permitted_method method GET HEAD
  acl permitted_path path_reg ^(/v[0-9]+\.[0-9]+)?/(_ping|version|info|events|containers/json|containers/[a-f0-9]+/(json|logs|stats))$
  http-request deny unless permitted_method permitted_path
  default_backend docker

backend docker
  server local unix@/var/run/docker.sock
